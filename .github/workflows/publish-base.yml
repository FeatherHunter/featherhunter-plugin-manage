name: publish-base

# Release channel for dsh-featherhunter-plugin-base.
# Local npmjs.org is unreachable from the maintainer network (TLS handshake reset),
# so the published tarball is produced here, on a runner that can reach the registry.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "npm dist-tag to publish under (latest / next / beta)"
        required: false
        default: latest
        type: string

permissions:
  contents: read

concurrency:
  group: publish-base
  cancel-in-progress: false

jobs:
  publish:
    name: Publish dsh-featherhunter-plugin-base
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/base
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: https://registry.npmjs.org
          cache: npm
          cache-dependency-path: packages/base/package-lock.json
      - name: Show release version
        run: node -p "JSON.parse(require('fs').readFileSync('package.json','utf8')).version"
      - name: Install dependencies
        run: npm ci
      - name: Build dist (prepublishOnly runs tests before build)
        run: npm run build
      - name: Publish to npm
        run: npm publish --tag "${{ inputs.tag }}"
        env:
          NODE_AUTH_TOKEN: "${{ secrets.NPM_TOKEN }}"
